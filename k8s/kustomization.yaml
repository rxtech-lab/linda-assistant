apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: linda-assistant
  namespace: linda

resources:
  - namespace.yaml
  # Do not include secrets.yaml in the kustomization to avoid accidentally applying it. Apply it manually with `kubectl apply -f k8s/secrets.yaml` after reviewing the contents.
  - configmap.yaml
  - frontend-deployment.yaml
  - frontend-service.yaml
  - worker-deployment.yaml
  - rabbitmq-deployment.yaml
  - rabbitmq-service.yaml
  - celery-deployment.yaml
  - celery-service.yaml
  - mem0-deployment.yaml
  - mem0-service.yaml
  - ingress.yaml

namespace: linda

images:
  - name: ghcr.io/rxtech-lab/linda-frontend
    newTag: latest
  - name: ghcr.io/rxtech-lab/linda-worker
    newTag: latest
  - name: ghcr.io/rxtech-lab/linda-celery
    newTag: latest
  - name: ghcr.io/rxtech-lab/linda-mem0
    newTag: latest
  - name: ghcr.io/rxtech-lab/headless-chrome-cjk
    newTag: latest
