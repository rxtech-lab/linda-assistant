apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: linda-assistant
  namespace: linda

resources:
  - namespace.yaml
  - configmap.yaml
  - frontend-deployment.yaml
  - frontend-service.yaml
  - worker-deployment.yaml
  - rabbitmq-deployment.yaml
  - rabbitmq-service.yaml
  - ingress.yaml

namespace: linda

images:
  - name: ghcr.io/rxtech-lab/linda-frontend
    newTag: latest
  - name: ghcr.io/rxtech-lab/linda-worker
    newTag: latest
