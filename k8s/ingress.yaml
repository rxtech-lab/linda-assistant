apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: linda-ingress
  namespace: linda
  labels:
    app: linda-assistant
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - linda.rxlab.app
      secretName: linda-tls
  rules:
    - host: linda.rxlab.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: linda-frontend-service
                port:
                  number: 3000
