apiVersion: v1
kind: Secret
metadata:
  name: linda-secrets
  namespace: linda
  labels:
    app: linda-assistant
type: Opaque
stringData:
  # Turso Database
  TURSO_DATABASE_URL: "PLACEHOLDER"
  TURSO_AUTH_TOKEN: "PLACEHOLDER"
  # Upstash Redis
  UPSTASH_REDIS_REST_URL: "PLACEHOLDER"
  UPSTASH_REDIS_REST_TOKEN: "PLACEHOLDER"
  # AWS S3
  AWS_ACCESS_KEY_ID: "PLACEHOLDER"
  AWS_SECRET_ACCESS_KEY: "PLACEHOLDER"
  AWS_REGION: "PLACEHOLDER"
  S3_API_URL: "PLACEHOLDER"
  S3_BUCKET_NAME: "PLACEHOLDER"
  # Resend Email
  RESEND_API_KEY: "PLACEHOLDER"
  RESEND_WEBHOOK_SECRET: "PLACEHOLDER"
  RESEND_DOMAIN: "PLACEHOLDER"
  # Anthropic AI
  ANTHROPIC_API_KEY: "PLACEHOLDER"
  # APNs Push Notifications
  APNS_KEY_ID: "PLACEHOLDER"
  APNS_TEAM_ID: "PLACEHOLDER"
  APNS_BUNDLE_ID: "PLACEHOLDER"
  APNS_KEY_BASE64: "PLACEHOLDER"
  APNS_ENVIRONMENT: "PLACEHOLDER"
  # RxLab OAuth
  RXLAB_JWKS_URL: "PLACEHOLDER"
