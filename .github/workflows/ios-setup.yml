name: iOS Setup

on:
  workflow_call:
    inputs:
      runs-on:
        description: 'Runner to use (JSON string, e.g., "macos-latest" or ["self-hosted", "macOS"])'
        required: false
        type: string
        default: '"macos-latest"'
      job-name:
        description: 'Name of the job'
        required: true
        type: string
      script:
        description: 'Script to run (e.g., ios-build.sh, ios-test.sh, macos-build.sh)'
        required: true
        type: string
      scheme:
        description: 'Xcode scheme to build'
        required: false
        type: string
        default: 'ios'
      configuration:
        description: 'Build configuration'
        required: false
        type: string
        default: 'Debug'
      sdk:
        description: 'SDK to use'
        required: false
        type: string
        default: 'iphonesimulator'
      artifact-name:
        description: 'Name for uploaded artifacts'
        required: false
        type: string
        default: 'build-logs'
      artifact-path:
        description: 'Path to artifact file'
        required: false
        type: string
        default: 'build.log'
      upload-test-results:
        description: 'Whether to upload test results'
        required: false
        type: boolean
        default: false

jobs:
  run:
    name: ${{ inputs.job-name }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Secrets.xcconfig from GitHub Secrets
        env:
          SECRETS_XCCONFIG_BASE64: ${{ secrets.SECRETS_XCCONFIG_BASE64 }}
        run: |
          echo "✅ Decoding Secrets.xcconfig from GitHub secrets"
          echo "$SECRETS_XCCONFIG_BASE64" | base64 --decode > ios/Config/Secrets.xcconfig
          echo "Contents of Secrets.xcconfig (with secrets masked):"
          sed 's/\(AUTH_CLIENT_ID.*=\).*/\1 ***/' ios/Config/Secrets.xcconfig

      - name: Setup .env from GitHub Secrets
        env:
          LINDA_TESTING_SECRETS_BASE64: ${{ secrets.LINDA_TESTING_SECRETS_BASE64 }}
        run: |
          echo "$LINDA_TESTING_SECRETS_BASE64" | base64 --decode > ios/iosUITests/.env
          echo "✅ Successfully decoded .env for iOS UI Tests"

      - name: Setup Admin .env from GitHub Secrets
        env:
          ADMIN_ENV_BASE64: ${{ secrets.ADMIN_ENV_BASE64 }}
        run: |
          if [ -z "$ADMIN_ENV_BASE64" ]; then
            echo "⚠️ Warning: ADMIN_ENV_BASE64 secret is not set, skipping admin .env setup"
          else
            echo "$ADMIN_ENV_BASE64" | base64 --decode > backend/.env
            echo "✅ Successfully decoded admin .env"
          fi    
      - name: Install xcbeautify
        run: brew install xcbeautify

      - name: Cache Xcode Build
        uses: irgaly/xcode-cache@v1
        with:
          key: xcode-${{ runner.os }}-${{ hashFiles('ios/packages/AssistantCore/Package.swift') }}
          restore-keys: xcode-${{ runner.os }}-

      - name: Start RabbitMQ
        run: |
          brew install rabbitmq
          brew services start rabbitmq
          echo "Waiting for RabbitMQ..."
          for i in {1..30}; do
            if rabbitmqctl status &>/dev/null; then
              echo "RabbitMQ is ready"
              break
            fi
            sleep 2
          done
          rabbitmqctl add_user linda linda
          rabbitmqctl set_permissions -p / linda ".*" ".*" ".*"

      - name: Start Backend Server
        run: bun install && bun dev:e2e > ../backend.log 2>&1 &
        working-directory: backend

      - name: Start Worker Server
        run: bun worker:e2e > ../worker.log 2>&1 &
        working-directory: backend

      - name: Wait for Backend Server
        run: |
          echo "Waiting for backend server to start..."
          for i in {1..30}; do
            if curl -s http://localhost:3000/api/health | grep -q "ok"; then
              echo "Backend server is up!"
              exit 0
            fi
            sleep 2
          done
          echo "Backend server did not start in time."
          exit 1

      - name: Wait for Worker Server
        run: |
          echo "Waiting for worker server to start..."
          for i in {1..30}; do
            if curl -s http://localhost:3002/healthz | grep -q "ok"; then
              echo "Worker server is up!"
              exit 0
            fi
            sleep 2
          done
          echo "Worker server did not start in time."
          exit 1

      - name: Generate openapi documentation
        run: ./scripts/ios-update-openapi.sh

      - name: Run Script
        run: ./scripts/${{ inputs.script }}
        env:
          SCHEME: ${{ inputs.scheme }}
          CONFIGURATION: ${{ inputs.configuration }}
          SDK: ${{ inputs.sdk }}

      - name: Upload Logs
        if: ${{ inputs.upload-test-results && failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.artifact-path }}
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Backend Log
        if: ${{ inputs.upload-test-results && always() }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.artifact-name }}-backend
          path: backend.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Worker Log
        if: ${{ inputs.upload-test-results && always() }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.artifact-name }}-worker
          path: worker.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Test Results
        if: ${{ inputs.upload-test-results && always() }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.artifact-name }}-results
          path: test-results.xcresult
          retention-days: 7

      - name: Extract Screenshots from xcresult
        if: ${{ inputs.upload-test-results && always() }}
        run: |
          if [ -d "test-results.xcresult" ]; then
            echo "Extracting screenshots from test-results.xcresult..."
            mkdir -p test-screenshots
            xcrun xcresulttool get test-results attachments \
              --path test-results.xcresult \
              --output-path test-screenshots || echo "No attachments found in result bundle"
            SCREENSHOT_COUNT=$(find test-screenshots -type f 2>/dev/null | wc -l | tr -d ' ')
            echo "Found $SCREENSHOT_COUNT attachment(s)"
          else
            echo "Result bundle not found at test-results.xcresult"
          fi

      - name: Upload Screenshots
        if: ${{ inputs.upload-test-results && always() }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.artifact-name }}-screenshots
          path: test-screenshots/
          retention-days: 7
          if-no-files-found: ignore

      - name: Generate Test Report
        if: ${{ inputs.upload-test-results && always() }}
        run: |
          if [ -d "test-results.xcresult" ]; then
            echo "## Test Results" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Test results bundle available in artifacts." >> $GITHUB_STEP_SUMMARY
          fi
