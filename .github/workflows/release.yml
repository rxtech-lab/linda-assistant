name: Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  release:
    types:
      - created

jobs:
  build-images:
    name: Build Docker Image (${{ matrix.image }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_TAG: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || format('sha-{0}', github.sha) }}
    strategy:
      matrix:
        include:
          - image: linda-frontend
            target: runner
            context: backend
          - image: linda-worker
            target: worker
            context: backend
          - image: linda-mem0
            context: mem0
          - image: linda-celery
            context: celery
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'release'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            type=sha,prefix=sha-

      - name: Build Docker image (test only)
        if: github.event_name != 'release'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target || '' }}
          push: false
          load: true
          tags: ${{ matrix.image }}:${{ env.IMAGE_TAG }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Start headless Chrome for PDF test
        if: github.event_name != 'release' && matrix.image == 'linda-frontend'
        run: |
          docker run -d --name pdf-chrome \
            -p 9222:9222 \
            ghcr.io/rxtech-lab/headless-chrome-cjk:latest
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9222/json/version > /dev/null 2>&1; then
              echo "Chrome is ready"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Chrome failed to start"
              docker logs pdf-chrome
              exit 1
            fi
            sleep 1
          done

      - name: PDF generation test (frontend)
        if: github.event_name != 'release' && matrix.image == 'linda-frontend'
        run: |
          docker run --rm --network host \
            -e CHROME_URL="ws://localhost:9222" \
            --entrypoint bun \
            ${{ matrix.image }}:${{ env.IMAGE_TAG }} \
            run scripts/test-pdf-generate.ts
          docker rm -f pdf-chrome

      - name: Health check (mem0)
        if: github.event_name != 'release' && matrix.image == 'linda-mem0'
        run: |
          docker network create mem0-net
          docker run -d --name qdrant --network mem0-net qdrant/qdrant:latest
          docker run -d --name mem0-test --network mem0-net -p 8000:8000 \
            -e OPENAI_API_KEY=sk-dummy \
            -e QDRANT_HOST=qdrant \
            ${{ matrix.image }}:${{ env.IMAGE_TAG }}
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/ > /dev/null 2>&1; then
              echo "Health check passed"
              docker rm -f mem0-test qdrant
              docker network rm mem0-net
              exit 0
            fi
            sleep 2
          done
          echo "Health check failed"
          docker logs mem0-test
          docker logs qdrant
          docker rm -f mem0-test qdrant
          docker network rm mem0-net
          exit 1

      - name: Health check (celery)
        if: github.event_name != 'release' && matrix.image == 'linda-celery'
        run: |
          docker run -d --name celery-test -p 8000:8000 \
            -e RABBITMQ_URL=amqp://guest:guest@localhost:5672 \
            -e CELERY_REDIS_URL=redis://localhost:6379 \
            -e BACKEND_INTERNAL_URL=http://localhost:3000 \
            -e CELERY_ADMIN_KEY=test-key \
            ${{ matrix.image }}:${{ env.IMAGE_TAG }}
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
              echo "Health check passed"
              docker rm -f celery-test
              exit 0
            fi
            sleep 2
          done
          echo "Health check failed"
          docker logs celery-test
          docker rm -f celery-test
          exit 1

      - name: Build and push Docker image
        if: github.event_name == 'release'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target || '' }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  k8s-deploy:
    name: Deploy to Kubernetes
    needs: build-images
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "latest"

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.K8S_CONFIG_FILE_B64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Verify kubectl connection
        run: kubectl cluster-info

      - name: Deploy with kustomize
        run: kubectl kustomize k8s/ | kubectl apply -f -

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Run database migrations
        working-directory: backend
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          bun install --frozen-lockfile
          bun drizzle-kit push

      - name: Update deployment images
        run: |
          VERSION="${{ github.ref_name }}"
          kubectl set image deployment/linda-frontend \
            linda-frontend=ghcr.io/${{ github.repository_owner }}/linda-frontend:${VERSION} \
            -n linda
          kubectl set image deployment/linda-worker \
            linda-worker=ghcr.io/${{ github.repository_owner }}/linda-worker:${VERSION} \
            -n linda
          kubectl set image deployment/mem0 \
            mem0=ghcr.io/${{ github.repository_owner }}/linda-mem0:${VERSION} \
            -n linda
          kubectl set image deployment/linda-celery \
            linda-celery=ghcr.io/${{ github.repository_owner }}/linda-celery:${VERSION} \
            -n linda

      - name: Wait for rollouts
        run: |
          kubectl rollout status deployment/linda-frontend -n linda --timeout=300s
          kubectl rollout status deployment/linda-worker -n linda --timeout=300s
          kubectl rollout status deployment/mem0 -n linda --timeout=300s
          kubectl rollout status deployment/linda-celery -n linda --timeout=300s

      - name: Verify deployment
        run: |
          echo "=== Pods ==="
          kubectl get pods -n linda
          echo "=== Services ==="
          kubectl get services -n linda
          echo "=== Ingress ==="
          kubectl get ingress -n linda

  e2e-k8s:
    name: E2E Tests (Kubernetes)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: github.event_name == 'pull_request'
    timeout-minutes: 30
    env:
      IMAGE_TAG: pr-${{ github.event.number }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker images (cache hit from build-images)
        run: |
          declare -A TARGETS=(
            ["linda-frontend"]="runner"
            ["linda-worker"]="worker"
          )
          declare -A CONTEXTS=(
            ["linda-frontend"]="backend"
            ["linda-worker"]="backend"
            ["linda-mem0"]="mem0"
            ["linda-celery"]="celery"
          )
          for IMAGE in linda-frontend linda-worker linda-mem0 linda-celery; do
            TARGET_ARG=""
            if [[ -n "${TARGETS[$IMAGE]:-}" ]]; then
              TARGET_ARG="--target ${TARGETS[$IMAGE]}"
            fi
            docker buildx build \
              ${TARGET_ARG} \
              --load \
              --tag "${IMAGE}:${IMAGE_TAG}" \
              --cache-from type=gha,scope=${IMAGE} \
              "${CONTEXTS[$IMAGE]}"
          done

      - name: Start minikube
        uses: medyagh/setup-minikube@latest
        with:
          driver: docker

      - name: Load images into minikube
        run: |
          minikube image load "linda-frontend:${IMAGE_TAG}"
          minikube image load "linda-worker:${IMAGE_TAG}"
          minikube image load "linda-mem0:${IMAGE_TAG}"
          minikube image load "linda-celery:${IMAGE_TAG}"

      - name: Decode secrets and configure kustomize
        run: |
          echo "${{ secrets.K8S_SECRETS_YAML_B64 }}" | base64 -d > k8s/secrets.yaml
          cd k8s
          kustomize edit set image \
            "ghcr.io/rxtech-lab/linda-frontend=linda-frontend:${IMAGE_TAG}" \
            "ghcr.io/rxtech-lab/linda-worker=linda-worker:${IMAGE_TAG}" \
            "ghcr.io/rxtech-lab/linda-mem0=linda-mem0:${IMAGE_TAG}" \
            "ghcr.io/rxtech-lab/linda-celery=linda-celery:${IMAGE_TAG}"

      - name: Deploy to minikube cluster
        run: kubectl apply -k k8s/ && kubectl apply -f k8s/secrets.yaml

      - name: Wait for rollouts
        run: |
          kubectl rollout status deployment/rabbitmq -n linda --timeout=300s
          kubectl rollout status deployment/linda-frontend -n linda --timeout=300s
          kubectl rollout status deployment/linda-worker -n linda --timeout=300s
          kubectl rollout status deployment/mem0 -n linda --timeout=300s
          kubectl rollout status deployment/linda-celery -n linda --timeout=300s

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Run database migrations
        working-directory: backend
        env:
          TURSO_DATABASE_URL: ${{ secrets.E2E_TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.E2E_TURSO_AUTH_TOKEN }}
        run: |
          bun install --frozen-lockfile
          bun drizzle-kit push

      - name: Port-forward frontend service
        run: |
          kubectl port-forward -n linda svc/linda-frontend-service 3000:3000 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health > /dev/null 2>&1; then
              echo "Frontend is ready"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Frontend failed to respond"
              kubectl logs -n linda -l app=linda-frontend --tail=50
              exit 1
            fi
            sleep 2
          done

      - name: Decode E2E environment
        run: echo "${{ secrets.E2E_ENV_B64 }}" | base64 -d > backend-e2e/.env

      - name: Install E2E dependencies
        working-directory: backend-e2e
        run: bun install

      - name: Install Playwright browsers
        working-directory: backend-e2e
        run: bunx playwright install chromium --with-deps

      - name: Run E2E tests
        working-directory: backend-e2e
        run: bunx playwright test

      - name: Debug on failure
        if: failure()
        run: |
          echo "=== Pods ==="
          kubectl get pods -n linda
          echo "=== Pod Logs (frontend) ==="
          kubectl logs -n linda -l app=linda-frontend --tail=100
          echo "=== Pod Logs (worker) ==="
          kubectl logs -n linda -l app=linda-worker --tail=50
          echo "=== Pod Logs (mem0) ==="
          kubectl logs -n linda -l app=mem0 --tail=50
          echo "=== Pod Logs (celery) ==="
          kubectl logs -n linda -l app=linda-celery --tail=50
          echo "=== Pod Logs (rabbitmq) ==="
          kubectl logs -n linda -l app=rabbitmq --tail=50

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-k8s
          path: backend-e2e/playwright-report/
          retention-days: 7
