name: E2E Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    timeout-minutes: 20
    runs-on: blacksmith-4vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: ./backend
    services:
      rabbitmq:
        image: rabbitmq:4-management-alpine
        ports:
          - 5672:5672
          - 15672:15672
        env:
          RABBITMQ_DEFAULT_USER: linda
          RABBITMQ_DEFAULT_PASS: linda
      redis:
        image: redis
        ports:
          - 6379:6379
      serverless-redis-http:
        image: hiett/serverless-redis-http:latest
        ports:
          - 8079:80
        env:
          SRH_MODE: env
          SRH_TOKEN: token
          SRH_CONNECTION_STRING: redis://redis:6379
      minio:
        image: bitnami/minio:latest
        ports:
          - "9000:9000"
          - "9001:9001"
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Install Playwright Browsers
        run: bunx playwright install chromium --with-deps

      - name: Run unit tests
        run: bun test

      - name: Run E2E tests
        run: bun run test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: backend/playwright-report/
          retention-days: 7

  e2e-k8s:
    name: E2E Tests (Kubernetes)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: github.event_name == 'pull_request'
    timeout-minutes: 30
    env:
      IMAGE_TAG: pr-${{ github.event.number }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker images (cache hit from build-images)
        run: |
          declare -A TARGETS=(
            ["linda-frontend"]="runner"
            ["linda-worker"]="worker"
          )
          declare -A CONTEXTS=(
            ["linda-frontend"]="backend"
            ["linda-worker"]="backend"
            ["linda-mem0"]="mem0"
            ["linda-celery"]="celery"
          )
          for IMAGE in linda-frontend linda-worker linda-mem0 linda-celery; do
            TARGET_ARG=""
            if [[ -n "${TARGETS[$IMAGE]:-}" ]]; then
              TARGET_ARG="--target ${TARGETS[$IMAGE]}"
            fi
            docker buildx build \
              ${TARGET_ARG} \
              --load \
              --tag "${IMAGE}:${IMAGE_TAG}" \
              --cache-from type=gha,scope=${IMAGE} \
              "${CONTEXTS[$IMAGE]}"
          done

      - name: Start minikube
        uses: medyagh/setup-minikube@latest
        with:
          driver: docker

      - name: Load images into minikube
        run: |
          minikube image load "linda-frontend:${IMAGE_TAG}"
          minikube image load "linda-worker:${IMAGE_TAG}"
          minikube image load "linda-mem0:${IMAGE_TAG}"
          minikube image load "linda-celery:${IMAGE_TAG}"

      - name: Decode secrets and configure kustomize
        run: |
          echo "${{ secrets.K8S_SECRETS_YAML_B64 }}" | base64 -d > k8s/secrets.yaml
          cd k8s
          kustomize edit set image \
            "ghcr.io/rxtech-lab/linda-frontend=linda-frontend:${IMAGE_TAG}" \
            "ghcr.io/rxtech-lab/linda-worker=linda-worker:${IMAGE_TAG}" \
            "ghcr.io/rxtech-lab/linda-mem0=linda-mem0:${IMAGE_TAG}" \
            "ghcr.io/rxtech-lab/linda-celery=linda-celery:${IMAGE_TAG}"

      - name: Deploy to minikube cluster
        run: kubectl apply -k k8s/ && kubectl apply -f k8s/secrets.yaml

      - name: Wait for rollouts
        run: |
          kubectl rollout status deployment/rabbitmq -n linda --timeout=300s
          kubectl rollout status deployment/linda-frontend -n linda --timeout=300s
          kubectl rollout status deployment/linda-worker -n linda --timeout=300s
          kubectl rollout status deployment/mem0 -n linda --timeout=300s
          kubectl rollout status deployment/linda-celery -n linda --timeout=300s
          kubectl rollout status deployment/headless-chrome -n linda --timeout=300s

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Run database migrations
        working-directory: backend
        env:
          TURSO_DATABASE_URL: ${{ secrets.E2E_TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.E2E_TURSO_AUTH_TOKEN }}
        run: |
          bun install --frozen-lockfile
          bun drizzle-kit push

      - name: Port-forward frontend service
        run: |
          kubectl port-forward -n linda svc/linda-frontend-service 3000:3000 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health > /dev/null 2>&1; then
              echo "Frontend is ready"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Frontend failed to respond"
              kubectl logs -n linda -l app=linda-frontend --tail=50
              exit 1
            fi
            sleep 2
          done

      - name: Decode E2E environment
        run: echo "${{ secrets.E2E_ENV_B64 }}" | base64 -d > backend-e2e/.env

      - name: Install E2E dependencies
        working-directory: backend-e2e
        run: bun install

      - name: Install Playwright browsers
        working-directory: backend-e2e
        run: bunx playwright install chromium --with-deps

      - name: Run E2E tests
        working-directory: backend-e2e
        run: bunx playwright test

      - name: Collect pod logs
        if: always()
        run: |
          mkdir -p /tmp/k8s-logs
          kubectl logs -n linda -l app=linda-frontend --tail=-1 > /tmp/k8s-logs/frontend.log 2>&1 || true
          kubectl logs -n linda -l app=linda-worker --tail=-1 > /tmp/k8s-logs/worker.log 2>&1 || true
          kubectl logs -n linda -l app=mem0 --tail=-1 > /tmp/k8s-logs/mem0.log 2>&1 || true
          kubectl logs -n linda -l app=linda-celery --tail=-1 > /tmp/k8s-logs/celery.log 2>&1 || true
          kubectl logs -n linda -l app=rabbitmq --tail=-1 > /tmp/k8s-logs/rabbitmq.log 2>&1 || true
          kubectl logs -n linda -l app=headless-chrome --tail=-1 > /tmp/k8s-logs/chrome.log 2>&1 || true
          kubectl get pods -n linda -o wide > /tmp/k8s-logs/pods.txt 2>&1 || true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-k8s
          path: backend-e2e/playwright-report/
          retention-days: 7

      - name: Upload pod logs
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: k8s-pod-logs
          path: /tmp/k8s-logs/
          retention-days: 7

  result:
    name: E2E Result
    if: always()
    needs: [test, e2e-k8s]
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.test.result }}" == "failure" || "${{ needs.e2e-k8s.result }}" == "failure" ]]; then
            echo "One or more E2E jobs failed"
            exit 1
          fi
