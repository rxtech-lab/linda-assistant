services:
  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: linda
      RABBITMQ_DEFAULT_PASS: linda
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
  redis:
    image: redis
    ports:
      - "6379:6379"
  serverless-redis-http:
    ports:
      - "8079:80"
    image: hiett/serverless-redis-http:latest
    environment:
      SRH_MODE: env
      SRH_TOKEN: token
      SRH_CONNECTION_STRING: "redis://redis:6379"
  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
  celery:
    build:
      context: ../celery
    ports:
      - "8099:8000"
    environment:
      RABBITMQ_URL: amqp://linda:linda@rabbitmq:5672
      CELERY_REDIS_URL: redis://redis:6379
      BACKEND_INTERNAL_URL: http://host.docker.internal:3000
      CELERY_ADMIN_KEY: local-dev-admin-key
    depends_on:
      - rabbitmq
      - redis
  mem0:
    build:
      context: ../mem0
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - MEM0_VECTOR_STORE_PROVIDER=upstash_vector
      - MEM0_LLM_MODEL=${MEM0_LLM_MODEL:-google/gemini-2.5-flash-lite}

volumes:
  rabbitmq_data:
  minio_data:

