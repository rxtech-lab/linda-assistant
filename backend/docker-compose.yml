services:
  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: linda
      RABBITMQ_DEFAULT_PASS: linda
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
  redis:
    image: redis
    ports:
      - "6379:6379"
  serverless-redis-http:
    ports:
      - "8079:80"
    image: hiett/serverless-redis-http:latest
    environment:
      SRH_MODE: env
      SRH_TOKEN: token
      SRH_CONNECTION_STRING: "redis://redis:6379"
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
  mem0:
    build:
      context: ../mem0
    ports:
      - "8000:8000"
    environment:
      - MEM0_VECTOR_STORE_PROVIDER=qdrant
      - QDRANT_HOST=qdrant
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - MEM0_LLM_MODEL=${MEM0_LLM_MODEL:-gpt-4.1-nano-2025-04-14}
    depends_on:
      - qdrant

volumes:
  rabbitmq_data:
  qdrant_data:
  minio_data:

